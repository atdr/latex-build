gitignore: true
globs:
  - '**/*.md'
config:
  # Off: prose here is not hard-wrapped, one line per paragraph or list item
  # (see AGENTS.md), and the rule has no setting that exempts prose alone.
  MD013: false
  MD046:
    style: fenced
  # mdformat writes every real heading as `# text`, and its rewrap can start a
  # line with an issue number (#21), which this rule mistakes for a heading.
  MD018: false
  # A README may open with a banner image above its title.
  MD041: false
ignores:
  # Generated by release-please.
  - CHANGELOG.md
  # A symlink to AGENTS.md, which is linted under its own name.
  - CLAUDE.md
