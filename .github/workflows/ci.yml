name: ci

# Builds each test document with this commit's workflow and scripts, on an
# old and the latest TeX Live release, as a calling repository would. The
# package lists are not committed, so every run also exercises regenerating
# them in the full TeX Live image.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default. The jobs that call build.yml grant it contents: write,
# which it needs as a caller's workflow would; with commit_package_list and
# publish_release off it writes nothing here.
permissions:
  contents: read

# Pull requests share a group per branch, so a new push cancels the run it
# supersedes. Every other run gets a group of its own: GitHub keeps only one
# pending run per group and drops the older for a newer, even with
# cancel-in-progress false, so a shared group on main would leave commits
# with no result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        document:
          - {name: fonts, engine: -xelatex, strict: true}
          - {name: latex-error, engine: -xelatex, strict: false}
          - {name: bibtex-no-citations, engine: -pdf, strict: false}
          - {name: eps-figure, engine: -xelatex, strict: true}
        texlive_version: ["2016", latest]
    uses: ./.github/workflows/build.yml
    permissions:
      contents: write
    with:
      root_file: tests/${{ matrix.document.name }}/main.tex
      engine: ${{ matrix.document.engine }}
      texlive_version: ${{ matrix.texlive_version }}
      package_list: >-
        tests/${{ matrix.document.name }}/texlive-packages.txt
      commit_package_list: false
      publish_release: false
      # Documents that must compile cleanly fail on any error
      fail_on_errors: ${{ matrix.document.strict }}
      # Every test document except tests/format is formatted with tex-fmt
      format_check: true
      artifact_suffix: >-
        -${{ matrix.document.name }}-${{ matrix.texlive_version }}

  # Lint and log warnings on a document known to have some; the check job
  # fails unless both kinds were reported
  warnings:
    strategy:
      fail-fast: false
      matrix:
        texlive_version: ["2016", latest]
    uses: ./.github/workflows/build.yml
    permissions:
      contents: write
    with:
      root_file: tests/warnings/main.tex
      engine: -pdf
      texlive_version: ${{ matrix.texlive_version }}
      package_list: tests/warnings/texlive-packages.txt
      commit_package_list: false
      publish_release: false
      lint: true
      annotate_warnings: true
      artifact_suffix: -warnings-${{ matrix.texlive_version }}

  check_warnings:
    needs: warnings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that warnings were reported
        env:
          WARNINGS: ${{ needs.warnings.outputs.warnings }}
        # An undefined reference, an overfull box and a chktex finding
        run: |
          echo "Reported $WARNINGS warning(s)"
          [ "${WARNINGS:-0}" -ge 3 ]

  # tests/format is deliberately not formatted, so the check must fail on it
  format_fails:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check that an unformatted document fails
        env:
          ROOT_FILE: tests/format/main.tex
        run: |
          if scripts/check-format.sh; then
            echo "::error::check-format.sh passed an unformatted document"
            exit 1
          fi

  # A manual run on another TeX Live version must not install the committed
  # list, which is for texlive_version; this one names a package that does
  # not exist, so installing it would fail
  version-override:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: write
    with:
      root_file: tests/bibtex-no-citations/main.tex
      engine: -pdf
      texlive_version: "2016"
      texlive_version_override: latest
      package_list: tests/version-override/texlive-packages.txt
      commit_package_list: false
      publish_release: false
      artifact_suffix: -version-override

  # The one check branch protection requires from this workflow, so adding a
  # test document or a TeX Live version never touches the ruleset.
  gate:
    name: ci gate
    # Not always(): a run superseded by a newer one is cancelled, and its gate
    # would report a failure on the same commit the newer run is checking.
    if: ${{ !cancelled() }}
    needs: [build, warnings, check_warnings, format_fails, version-override]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              failure|cancelled) echo "::error::a required job finished as $result"; exit 1 ;;
            esac
          done
