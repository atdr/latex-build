# Needs Python 3.13 or later: `exclude` errors below it.
# Prose stays one line per paragraph, as AGENTS.md asks; mdformat only pads
# tables and normalises whitespace.
wrap = "keep"
number = true
exclude = [
  "CHANGELOG.md",
  "CLAUDE.md",
  ".venv/**",
  ".pytest_cache/**",
  "node_modules/**",
]
